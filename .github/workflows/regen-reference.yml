name: Regenerate reference data

# Rebuilds the API data the site renders -- generated/trussc-api.js (reference),
# trusssketch-ref.js / trusssketch-api.js (TrussSketch reference + editor) and
# of-mapping.json, plus trusscli-help.json -- from TrussC's main branch.
# Unchanged TrussC revisions skip generation unless manually forced.
#
# The pipeline is TrussC's own (docs/reference/README.md): clang reads the C++
# headers, generate.js joins that with the hand-written api-reference.toml into
# reference-data.json, and the emitters write into ../../../trussc.org/generated/.
# So TrussC and this repo are checked out side by side.
#
# It runs on macOS on purpose: the headers are parsed for the platform they are
# compiled on, and a Linux parse drops the macOS-only API (VideoWriter::lockFrame
# and friends) from the reference. The site data has always been generated on a Mac.
#
# Pushes to the workflow itself run it as a dry run (generate + report, no commit),
# so a change to this file is tested before the nightly run uses it.
#
# A failed run leaves the site on its last good data and does not show on the
# site itself, so check it after TrussC build or docs changes:
#   gh run list -R TrussC-org/trussc.org --workflow regen-reference.yml --limit 5

on:
  schedule:
    - cron: '17 18 * * *'          # daily, 03:17 JST
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even when the recorded TrussC commit is unchanged'
        type: boolean
        default: false
      dry_run:
        description: 'Generate and report the diff, but do not commit'
        type: boolean
        default: false
      allow_shrink:
        description: 'Commit even if a generated file lost more than 5% of its symbols'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/regen-reference.yml'
      - '.github/scripts/check-regen.mjs'
      - '.github/scripts/trusscli-help.py'
      - '.github/scripts/test_trusscli_help.py'

concurrency:
  group: regen-reference
  cancel-in-progress: false

jobs:
  check:
    # Only a revision compare; no macOS runner needed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.revision.outputs.should_run }}
      trussc_commit: ${{ steps.revision.outputs.trussc_commit }}
    steps:
      - name: Check out trussc.org
        uses: actions/checkout@v5
        with:
          path: trussc.org

      - name: Check out TrussC (main)
        uses: actions/checkout@v5
        with:
          repository: TrussC-org/TrussC
          ref: main
          path: TrussC

      - name: Compare the recorded TrussC revision
        id: revision
        env:
          # A push that edits this workflow is its dry run, so it always runs.
          FORCE: ${{ inputs.force == true || github.event_name == 'push' }}
        run: |
          TC_SHA=$(git -C TrussC rev-parse HEAD)
          FORCE_ARGS=()
          if [ "$FORCE" = 'true' ]; then FORCE_ARGS+=(--force); fi
          SHOULD_RUN=$(python3 trussc.org/.github/scripts/trusscli-help.py should-run \
            --marker trussc.org/generated/trusscli-help.json --commit "$TC_SHA" "${FORCE_ARGS[@]}")
          echo "trussc_commit=$TC_SHA" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "TrussC $TC_SHA: run nightly = $SHOULD_RUN" >> "$GITHUB_STEP_SUMMARY"

  regen:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write               # push the regenerated data
      pages: write                  # request a Pages build after the push
    env:
      DRY_RUN: ${{ github.event_name == 'push' || inputs.dry_run == true }}
    steps:
      - name: Check out TrussC (main)
        uses: actions/checkout@v5
        with:
          repository: TrussC-org/TrussC
          ref: ${{ needs.check.outputs.trussc_commit }}
          path: TrussC
          # The emitters stamp the version from `git describe --tags`, so the tags
          # and the history leading to them are needed; blobs are fetched lazily.
          fetch-depth: 0
          filter: blob:none

      - name: Check out trussc.org
        uses: actions/checkout@v5
        with:
          path: trussc.org

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Test help capture and revision gate
        run: python3 trussc.org/.github/scripts/test_trusscli_help.py -v

      - name: Cache the trusscli Release build
        uses: actions/cache@v4
        with:
          path: |
            TrussC/tools/build-help
            TrussC/core/build-macos
          key: trusscli-help-${{ runner.os }}-${{ runner.arch }}-${{ needs.check.outputs.trussc_commit }}
          restore-keys: |
            trusscli-help-${{ runner.os }}-${{ runner.arch }}-

      - name: Build trusscli (Release only)
        run: |
          cmake -S TrussC/tools -B TrussC/tools/build-help -DCMAKE_BUILD_TYPE=Release
          cmake --build TrussC/tools/build-help --target trusscli --config Release --parallel 3

      - name: Save trusscli help
        run: |
          python3 trussc.org/.github/scripts/trusscli-help.py capture \
            --binary TrussC/tools/bin/trusscli.app/Contents/MacOS/trusscli \
            --commit '${{ needs.check.outputs.trussc_commit }}' \
            --output trussc.org/generated/trusscli-help.json

      # The headers include the built-in shaders' generated *.glsl.h, which are
      # gitignored and produced by the build. Without them clang stops mid-parse
      # and generate.js (rightly) refuses to render from a partial AST. Use
      # TrussC's own documented bootstrap (docs/reference/README.md) instead of
      # naming its internal CMake target here: the target was renamed once
      # (TrussC_shaders -> TrussC_shaders_gen, TrussC #823) and this step failed
      # every night from 2026-10-16 until it was noticed.
      # TrussC moved its doc tooling from docs/reference/ to docs/scripts/
      # (data stays in docs/reference/). Accept both layouts until every
      # branch this workflow checks out has the new one.
      - name: Locate the doc tooling
        run: |
          if [ -f TrussC/docs/scripts/regenerate.sh ]; then
            echo "TC_TOOLS=docs/scripts" >> "$GITHUB_ENV"
          else
            echo "TC_TOOLS=docs/reference" >> "$GITHUB_ENV"
          fi

      - name: Generate built-in shader headers
        run: TrussC/$TC_TOOLS/regenerate.sh --shaders-only

      - name: Install doc tooling deps
        run: |
          if [ -f TrussC/docs/scripts/package.json ]; then cd TrussC/docs/scripts; else cd TrussC/docs; fi
          npm ci

      - name: Build reference-data.json (clang AST + api-reference.toml)
        # /usr/bin/time -l reports the peak RSS: the runner has ~7 GB, the heap cap is 8 GB.
        run: cd TrussC && /usr/bin/time -l node --max-old-space-size=8192 $TC_TOOLS/generate.js

      - name: Emit site data
        run: |
          cd TrussC/docs
          node scripts/emit-web.js
          # Second pass: scan-examples.js links examples to symbols by reading the
          # trussc-api.js the first pass just wrote.
          node scripts/emit-web.js
          node scripts/emit-sketch-reference.js
          node scripts/emit-sketch-api.js
          node ../$TC_TOOLS/emit-of.js

      - name: Check symbol counts
        working-directory: trussc.org
        env:
          MAX_SHRINK: ${{ inputs.allow_shrink == true && '1' || '0.05' }}
        run: node .github/scripts/check-regen.mjs

      - name: Show the diff
        working-directory: trussc.org
        run: |
          git status --short
          git add -N generated/trusscli-help.json
          git diff --stat -- generated/
          {
            echo '### Changed files'
            echo '```'
            git diff --stat -- generated/ || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff -- generated/ > "$RUNNER_TEMP/regen.diff" || true

      - name: Upload the diff
        uses: actions/upload-artifact@v4
        with:
          name: regen-diff
          path: ${{ runner.temp }}/regen.diff
          if-no-files-found: ignore

      - name: Commit and push
        if: env.DRY_RUN != 'true'
        working-directory: trussc.org
        run: |
          git add generated/
          if git diff --cached --quiet; then
            echo "Reference data unchanged."
            exit 0
          fi
          TC_SHA=$(git -C ../TrussC rev-parse --short HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "doc: regenerate reference data from TrussC ${TC_SHA}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "PUSHED=1" >> "$GITHUB_ENV"

      # A push made with GITHUB_TOKEN is not guaranteed to start the branch-based
      # Pages build, so ask for one explicitly.
      - name: Request a Pages build
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
