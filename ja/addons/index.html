<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アドオン一覧 | TrussC</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="description" content="TrussCのバンドル/コミュニティアドオン一覧。物理、ネットワーク、GUI、コンピュータビジョン、スクリプティングなど。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Ubuntu:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../addons/addons.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">
                <img src="../../assets/images/logo-navigator.svg" alt="TrussC" class="logo-img">
            </a>
            <button class="nav-toggle" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="../../reference/">リファレンス</a></li>
                <li><a href="../../examples/">サンプル</a></li>
                <li><a href="./" class="active">アドオン</a></li>
                <li><a href="../for-of-users.html">oFユーザーへ</a></li>
                <li><a href="https://gemini.google.com/gem/16aq3ccVPl33j6xSMyE7MWXDjaZvauL0I" target="_blank" rel="noopener">AIに聞く</a></li>
                <li><a href="https://github.com/TrussC-org/TrussC/blob/main/docs/GET_STARTED_jp.md" class="nav-cta" target="_blank" rel="noopener">始める</a></li>
                <li class="lang-dropdown">
                    <button class="nav-lang" onclick="this.parentElement.classList.toggle('open')"><img src="../../assets/images/globe.svg" alt="" class="lang-icon"> ▾</button>
                    <ul class="lang-menu">
                        <li><a href="/addons/">EN</a></li>
                        <li><a href="/ja/addons/" class="active">日本語</a></li>
                        <li><a href="/ko/addons/">한국어</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Hero -->
    <header class="addons-hero">
        <div class="container">
            <p class="addons-hero-label">Addons</p>
            <h1 class="addons-hero-title">
                アドオンで<br>
                <span class="addons-hero-accent">TrussCを拡張</span>
            </h1>
            <p class="addons-hero-description">
                バンドル済みモジュールとコミュニティ製アドオン。
                物理、ネットワーク、GUI、コンピュータビジョン、スクリプティングなど。
            </p>
        </div>
    </header>

    <!-- Addons grid -->
    <section class="section addons-section">
        <div class="container">
            <div class="addons-toolbar">
                <input id="addons-search" type="search" class="addons-search" placeholder="検索...">
                <div id="addons-bundle-filter" class="addons-filter-group" role="group" aria-label="バンドルフィルタ">
                    <button class="addons-filter-btn active" data-value="all">すべて</button>
                    <button class="addons-filter-btn" data-value="bundled">バンドル</button>
                    <button class="addons-filter-btn" data-value="community">コミュニティ</button>
                </div>
            </div>
            <div class="addons-toolbar">
                <div id="addons-platform-filter" class="addons-filter-group" role="group" aria-label="プラットフォームフィルタ">
                    <button class="addons-filter-btn active" data-value="all">すべて</button>
                </div>
                <div id="addons-count" class="addons-meta"></div>
            </div>
            <div id="addons-meta" class="addons-meta"></div>

            <div id="addons-status" class="addons-status">アドオン一覧を読み込み中...</div>
            <div id="addons-empty" class="addons-empty" style="display:none;"></div>
            <div id="addons-grid" class="addons-grid" style="display:none;"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 TrussC. <a href="../../license.html">MITライセンス</a>で公開されています。</p>
            </div>
        </div>
    </footer>

    <script>
        window.ADDONS_I18N = {
            loading: 'アドオン一覧を読み込み中...',
            errorTitle: 'アドオンレジストリを読み込めませんでした',
            errorBody: 'ネットワーク接続を確認してから再度お試しください。',
            emptyResult: '条件に一致するアドオンがありません。',
            countLabel: (n, total) => `${n} / ${total} 件`,
            lastUpdated: '最終更新',
            searchPlaceholder: '名前・説明・キーワードで検索...',
            filterAll: 'すべて',
            filterBundled: 'バンドル',
            filterCommunity: 'コミュニティ',
            bundledTag: 'バンドル',
            communityTag: 'コミュニティ',
            licenseUnknown: '不明',
            platformsNotDeclared: 'プラットフォーム未宣言',
            author: '作者',
            version: 'バージョン',
            license: 'ライセンス',
            trusscVersion: '対応TrussCバージョン',
            dependencies: '依存',
            keywords: 'キーワード',
            longDescription: '説明',
            sourceLink: 'ソース',
            demoLink: 'デモ',
            detailsToggleOpen: '詳細',
            detailsToggleClose: '詳細を閉じる',
            descMissing: '説明が登録されていません。'
        };
    </script>
    <script src="../../script.js"></script>
    <script src="../../addons/addons.js"></script>
</body>
</html>
